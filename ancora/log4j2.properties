# Spark's driver logging for the CLI and the tests. WARN is the floor; the
# Parquet memory manager is demoted because it warns, at every write, that it
# is doing exactly what it is designed to do.
rootLogger.level = warn
rootLogger.appenderRef.stdout.ref = console

appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yy/MM/dd HH:mm:ss} %p %c{1}: %m%n

logger.parquet.name = org.apache.parquet
logger.parquet.level = error

# RFM scores are ranked over every customer of a snapshot, on purpose; the
# window has one partition and Spark warns about it every run.
logger.window.name = org.apache.spark.sql.execution.window.WindowExec
logger.window.level = error

# Delta's MERGE checkpoints an RDD locally and Spark notes that its lineage
# is gone. Expected, and not actionable from here.
logger.rdd.name = org.apache.spark.rdd.MapPartitionsRDD
logger.rdd.level = error
