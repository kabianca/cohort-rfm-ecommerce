services:
  ancora:
    build: .
    image: ancora:local
    # The source tree is mounted over the editable install so a change on the
    # host is live in the container without a rebuild. ./data holds every
    # layer of the lakehouse and is never committed.
    volumes:
      - ./ancora:/app/ancora
      - ./tests:/app/tests
      - ./docs:/app/docs
      - ./data:/app/data
      # Lint reads its config and the READMEs from the working tree, not from
      # the copies baked into the image at build time, or `make lint` passes
      # locally on a stale image and fails in CI on a fresh one.
      - ./pyproject.toml:/app/pyproject.toml:ro
      - ./README.md:/app/README.md:ro
      - ./README.pt-BR.md:/app/README.pt-BR.md:ro
    environment:
      ANCORA_DATA_DIR: /app/data
